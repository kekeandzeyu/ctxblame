name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  # 如果你更习惯在 GitHub 页面点 "Create a new release" 再触发，
  # 可以把上面 push.tags 换成：
  # release:
  #   types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing 必需
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
